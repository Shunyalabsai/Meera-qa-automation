name: Scheduled QA Automated Test Suite & Dashboard

on:
  schedule:
    # 4:30 AM IST is 23:00 UTC previous day
    - cron: '0 23 * * *'
    # 5:30 PM IST is 12:00 UTC
    - cron: '0 12 * * *'
  repository_dispatch:
    types: [scheduled_daily_run, scheduled_test_run, meera_scheduled_run]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "scheduled-qa"
  cancel-in-progress: false

jobs:
  run-tests-and-update-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Configure Git Credentials
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Restore Auth Session & Service Account Credentials
        env:
          AUTH_JSON: ${{ secrets.E2E_USER_AUTH_JSON }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p .auth
          if [ -n "$AUTH_JSON" ]; then
            printf '%s\n' "$AUTH_JSON" > .auth/user.json
            echo "✓ Restored .auth/user.json from GitHub Secret"
          fi
          if [ -n "$SERVICE_ACCOUNT_JSON" ]; then
            printf '%s\n' "$SERVICE_ACCOUNT_JSON" > meera-500407-7ed504955ec2.json
            echo "✓ Restored service account credentials from GitHub Secret"
          fi

      - name: Scan Test Catalog & Prepare Dashboard
        run: |
          node e2e/scripts/scan-test-catalog.mjs
          node e2e/scripts/build-dashboard.mjs

      - name: Run Test Suite
        env:
          CI: true
          E2E_USE_SAVED_AUTH: "true"
          PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL || 'https://agents.shunyalabs.ai/vap/' }}
          GOOGLE_RESULTS_SHEET_ID: ${{ vars.GOOGLE_RESULTS_SHEET_ID || '1QbaJTyhdn1eNIIJkOFbglgyYkpffuN4I2GYUTrhcEvc' }}
          E2E_SHEET_AUTO_PUBLISH: "true"
        run: |
          npm run test:smoke || true

      - name: Update Google Sheets & Build Final QA Dashboard
        env:
          CI: true
          E2E_SHEET_AUTO_PUBLISH: "true"
          GOOGLE_RESULTS_SHEET_ID: ${{ vars.GOOGLE_RESULTS_SHEET_ID || '1QbaJTyhdn1eNIIJkOFbglgyYkpffuN4I2GYUTrhcEvc' }}
        run: |
          npm run sheet:update || {
            node e2e/scripts/scan-test-catalog.mjs
            node e2e/scripts/build-dashboard.mjs
          }

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
