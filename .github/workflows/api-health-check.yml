name: 5-Minute API & Platform Health Check

on:
  schedule:
    # Runs every 5 minutes 24/7
    - cron: '*/5 * * * *'
  repository_dispatch:
    types: [vap_health_check, api_health_check, health_check]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "api-health-check"
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run 5-Minute API Health Probes
        id: api_probe
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL || 'https://agents.shunyalabs.ai/vap/' }}
          E2E_SHEET_AUTO_PUBLISH: "false"
        run: |
          npx playwright test e2e/tests/suite/api/health.spec.ts --reporter=list,json:test-results/results.json

      - name: Send Failure Alert to yamini@shunyalabs.in (On Probe Failure)
        if: failure()
        env:
          ALERT_EMAIL: "yamini@shunyalabs.in"
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: |
          node scripts/send-health-failure-email.mjs
